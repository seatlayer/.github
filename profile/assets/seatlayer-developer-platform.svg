<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">SeatLayer</title>
  <desc id="desc">Seat map APIs and SDKs for web, mobile, and server applications.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151E31"/>
      <stop offset="1" stop-color="#0C1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4B740"/>
      <stop offset="1" stop-color="#FFD77E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="24" fill="#0C1220"/>
  <path d="M0 244 C180 176 300 292 500 224 S836 170 1200 228 V300 H0 Z" fill="#111A2B"/>
  <circle cx="1120" cy="42" r="116" fill="#F4B740" opacity=".045"/>

  <!-- Canonical SeatLayer three-row mark in the reversed palette. -->
  <g transform="translate(58 54) scale(1.42)">
    <path d="M4 13 Q16 6 29 7 L28.5 17 Q17 16.5 7 22 Z" fill="#F4B740"/>
    <path d="M4 13 Q16 6 29 7 L28.5 17 Q17 16.5 7 22 Z" fill="#F4B740" transform="translate(64 0) scale(-1 1)"/>
    <path d="M8 28 Q18 22 28.6 23 L28.2 32 Q18 28.5 10 36 Z" fill="#FCF7EE"/>
    <path d="M8 28 Q18 22 28.6 23 L28.2 32 Q18 28.5 10 36 Z" fill="#FCF7EE" transform="translate(64 0) scale(-1 1)"/>
    <path d="M11 41 Q19 35 28.2 36 L27.8 45 Q19.5 42 13.5 49 Z" fill="#FCF7EE"/>
    <path d="M11 41 Q19 35 28.2 36 L27.8 45 Q19.5 42 13.5 49 Z" fill="#FCF7EE" transform="translate(64 0) scale(-1 1)"/>
  </g>

  <text x="174" y="105" fill="#FCF7EE" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="54" font-weight="750" letter-spacing="-1.6">SeatLayer</text>
  <text x="62" y="174" fill="#FCF7EE" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="600">Seat map APIs and SDKs</text>
  <text x="62" y="210" fill="#AAB4C5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">Build reserved seating into web, mobile, and backend applications.</text>
  <rect x="62" y="238" width="254" height="3" rx="1.5" fill="url(#accent)"/>

  <g transform="translate(760 47)">
    <rect width="378" height="206" rx="18" fill="url(#panel)" stroke="#2A3650"/>
    <circle cx="25" cy="24" r="4" fill="#F4B740"/>
    <circle cx="40" cy="24" r="4" fill="#526079"/>
    <circle cx="55" cy="24" r="4" fill="#526079"/>
    <path d="M0 47 H378" stroke="#2A3650"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
      <text x="28" y="82" fill="#F4B740">buyer SDK</text>
      <text x="151" y="82" fill="#FCF7EE">web · mobile</text>
      <text x="28" y="122" fill="#F4B740">server SDK</text>
      <text x="151" y="122" fill="#FCF7EE">holds · bookings</text>
      <text x="28" y="162" fill="#F4B740">platform API</text>
      <text x="151" y="162" fill="#FCF7EE">inventory · webhooks</text>
    </g>
    <path d="M28 187 H350" stroke="#2A3650"/>
    <circle cx="319" cy="187" r="4" fill="#F4B740"/>
    <circle cx="334" cy="187" r="4" fill="#FCF7EE" opacity=".62"/>
    <circle cx="349" cy="187" r="4" fill="#FCF7EE" opacity=".32"/>
  </g>
</svg>
